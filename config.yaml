# betedge configuration
#
# Tuned for: DraftKings only (Oregon), 20,000 credits a month.
# Everything here can be overridden per-run with CLI flags.
#
# If you change one thing, change `bankroll.amount`. Everything else has a
# defensible default; that one is personal.

api:
  base_url: https://api.the-odds-api.com/v4
  key_env: ODDS_API_KEY        # the key itself lives in .env, never in here
  timeout_seconds: 20
  max_retries: 3

  # Backstops. The real pacing is the `budget:` section below -- these two
  # only catch a single runaway call.
  min_credits_remaining: 100
  max_credits_per_scan: 600

  # Seconds to reuse a cached API response. Keep at 0 for live scanning.
  # Set to 300 while you are tinkering so reruns cost nothing.
  cache_seconds: 0
  cache_dir: data/cache

# ---------------------------------------------------------------------------
# CREDIT BUDGET
#
# The per-scan ceiling above stops one bad call. This stops the slower
# failure: spending three weeks of quota in four days and going dark.
#
# Spend is paced as (credits left) / (days left in cycle), times the burst
# factor. Unspent credits roll forward on their own -- a quiet day leaves
# more remaining, so the next day's pace is higher. Check it any time with
# `betedge budget`.
# ---------------------------------------------------------------------------
budget:
  enabled: true
  monthly_credits: 20000
  # The day of the month the plan renews. This has to match the real
  # billing day or the pacing is wrong twice over: it spreads the quota
  # across the wrong number of days, and it resets the local tally on a day
  # the provider does not refill.
  #
  # Subscription started 13 Sep, so the cycle is the 13th to the 13th.
  cycle_day: 13
  # Held back for closing-line capture, which is the only fast evidence
  # that the model works at all. Scanning never eats into it.
  reserve: 800
  # A day may spend twice the even pace, so an NFL Sunday can borrow from a
  # quiet Tuesday. Raising this above about 4 defeats the point.
  daily_burst: 2.0

books:
  sharp: pinnacle
  # DraftKings only -- Oregon permits no other book, and every extra book
  # in this list is another that has to be parsed for no reachable bet.
  soft:
    - draftkings

model:
  # How to strip Pinnacle's margin out of its prices.
  #   multiplicative - proportional to each side's raw probability
  #   additive       - equal absolute share (identical to shin on two-way markets)
  #   shin           - insider-trading model; matters on three-way soccer markets
  #   power          - solves sum(q^k)=1; least generous to longshots
  #   worst_case     - the lowest fair probability any method gives
  #
  # worst_case is the default on purpose. On near-even markets the methods
  # agree to within half a point; on lopsided ones they disagree enormously.
  # Taking the lowest means a bet only clears the bar if it clears it on
  # every method.
  devig_method: worst_case

  # The base bar, for deep markets. Props sit above this once the
  # liquidity adjustment is applied (about +2.1% at 1.5% base).
  #
  # 1.5% rather than 2% deliberately, and it is not a loosening of
  # standards: quarter-Kelly already sizes a +1.6% bet at a fraction of a
  # +6% one, so a lower bar adds small positions rather than bad ones. The
  # binding problem at this stage is sample size -- closing-line value
  # needs dozens of settled bets to say anything, and two flags a day
  # never gets there. Raise it back to 0.02 once CLV has an opinion.
  min_ev: 0.015
  max_plausible_ev: 0.15       # above this, mark suspect instead of recommending

  # How much MORE edge a thin market has to show. The bar becomes
  #     min_ev * (1 + penalty * (1 - liquidity))
  # so at 1.5: game lines flag at +2%, primary props at about +3%, and
  # alternate lines at about +4.5%. The reason is not caution for its own
  # sake -- in a thin market the error on the fair probability is about the
  # size of the edge being claimed. Set to 0 for one flat bar everywhere.
  liquidity_ev_penalty: 1.5
  # Refuse anything below this liquidity score outright, whatever its EV.
  # 0.30 drops alternate lines and the exotic props; 0 disables the floor.
  min_liquidity: 0.0

  min_overround: 0.005         # sanity bounds on Pinnacle's own margin
  max_overround: 0.15
  max_devig_spread: 0.04       # skip when the de-vig methods disagree too much

  max_soft_staleness_minutes: 20
  max_sharp_staleness_minutes: 20

  min_minutes_to_start: 5      # too late to get a bet down inside this
  max_hours_to_start: 72

  # Alternate lines carry the biggest apparent edges and the most stale
  # prices. The liquidity bar already makes them clear about +4.5% before
  # they surface, but they still cost credits to fetch. Leave off.
  include_alternate_lines: false

bankroll:
  amount: 1000                 # set this to what you are willing to lose
  kelly_multiplier: 0.25       # quarter Kelly
  max_fraction: 0.02           # never more than 2% of bankroll on one bet
  min_stake: 5
  round_to: 5
  max_total_exposure_fraction: 0.15   # cap on everything live at once

# ---------------------------------------------------------------------------
# GAME-LEVEL MARKETS: moneyline, spreads, totals.
#
# Cost is markets x 1 for the ENTIRE sport, not per event, so one sweep of
# every match on the board is 3 credits. Roughly fifty times cheaper per
# opportunity than props -- and these are the deep, sharply priced markets
# the liquidity scoring favours, so they clear the bar at +2% rather than
# +3% or more.
#
# A full sweep of this list is about 28 credits. At 20,000 a month you can
# afford to run it roughly hourly, which matters more than it sounds:
# a soft-book edge often lives for minutes, not hours.
#
# A trailing '*' matches by prefix. Tennis publishes one sport key per
# tournament and they rotate weekly, so 'tennis_*' is the only maintainable
# way to say "all tennis".
# ---------------------------------------------------------------------------
core_sports:
  - "tennis_*"              # Pinnacle is THE reference book here; US books lag
  - baseball_mlb            # moneyline, run line and totals: 3 credits
  - americanfootball_nfl
  - mma_mixed_martial_arts  # moneyline only, so 1 credit
  # - basketball_nba        # uncomment late October
  # - icehockey_nhl         # uncomment October

# ---------------------------------------------------------------------------
# SPORTS NEVER TO SCAN, whatever else asks for them.
#
# Oregon prohibits collegiate wagering, so DraftKings will not take an NCAA
# bet. Scanning college is therefore worse than useless: it spends credits
# to surface edges you cannot act on, and pushes real bets down the list.
#
# This is enforced in the scan engine rather than by leaving college out of
# the lists above, so `--sports basketball_ncaab` and a wildcard like
# `americanfootball_*` are both caught too. Patterns take a wildcard
# anywhere; '*ncaa*' covers ncaaf, ncaab, wncaab and the baseball key,
# which share no common prefix.
#
# Empty this list if you ever bet somewhere that allows it.
# ---------------------------------------------------------------------------
excluded_sports:
  - "*ncaa*"

# Narrow the game-level market list for one sport. The bulk endpoint bills
# for markets REQUESTED, not returned, so asking for markets a sport does
# not price is pure waste.
core_markets:
  mma_mixed_martial_arts:
    - h2h

# ---------------------------------------------------------------------------
# PLAYER PROPS. Expensive: cost is markets x events.
#
# Kept deliberately short. Props are where the big apparent edges are, and
# also where most of them are not real -- the liquidity bar now makes them
# show about +3% before surfacing. Two MLB markets across a full slate is
# ~30 credits; all ten would be ~150.
# ---------------------------------------------------------------------------
sports:
  - baseball_mlb
  - americanfootball_nfl
  # - basketball_nba        # season starts late October
  # - icehockey_nhl         # season starts October

# Which prop markets to ask for, per sport. Sports left out use the full
# registry list from markets.py, which is usually more than you want.
#
# Pitcher strikeouts and batter total bases are the usual hunting ground:
# heavily bet, so Pinnacle prices them carefully, but slow to move at the
# soft books when a lineup or a park factor changes.
prop_markets:
  baseball_mlb:
    # Four markets, not two. Cost is markets x events, so this takes a
    # full slate from ~30 credits to ~60 -- affordable at roughly seven
    # prop runs a day, which is more than the productive window needs.
    #
    # Widening beats re-scanning: DraftKings is not repricing these every
    # hour, so a fifth look at the same two markets mostly re-reads the
    # same numbers, while a new market is a genuinely new set of chances.
    # All four are primary-tier, so they keep the lower bar.
    - pitcher_strikeouts
    - batter_total_bases
    - batter_hits
    - batter_rbis
  americanfootball_nfl:
    - player_pass_yds
    - player_rush_yds
    - player_reception_yds
    - player_receptions
    - player_anytime_td

# How far ahead the PROP pass looks, per sport, in hours. This filter runs
# on the free event list, so every event it drops is a per-event call never
# billed.
#
# MLB is the important one. Batter props void if the player does not start
# and pitcher props void on a scratched starter, so until lineups post --
# two to four hours before first pitch -- the numbers are placeholders and
# Pinnacle's limits are low. Scanning an evening slate in the morning
# spends credits to price lines that do not exist yet.
prop_windows:
  baseball_mlb: 8
  americanfootball_nfl: 48

# ---------------------------------------------------------------------------
# SCAN PROFILES: named bundles of overrides, applied with --profile.
#
# For a recurring situation that would otherwise mean editing this file and
# then editing it back. The one that prompted it: a Thursday night game is
# a single event about 57 hours out, which the 48-hour NFL prop window
# below excludes entirely -- so a scan on the Tuesday finds nothing and
# looks broken.
#
#   betedge profiles                        what exists, and what each
#                                           one would change against THIS file
#   betedge parlay scan --profile nfl-week  apply one
#
# `nfl-week` ships with betedge (see betedge/data/profiles.yaml). Define
# your own here; a profile of the same name replaces the shipped one.
#
# Every override a profile applies is printed before the scan runs. A
# profile can reach the staking fractions and the guard thresholds, and a
# silent change to either is exactly what the rest of this tool refuses to
# do, so the run states what moved and what it was before.
#
# profiles:
#   mlb-tonight:
#     description: Just tonight's slate, pitchers only.
#     sports: [baseball_mlb]
#     prop_windows: {baseball_mlb: 6}
#     prop_markets: {baseball_mlb: [pitcher_strikeouts, pitcher_outs]}
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# MULTI-LEG TICKETS: pick'em entries and parlays.
#
# A different objective from everything above. The single-bet scanner looks
# for a soft PRICE that beats Pinnacle's fair one. This looks for a set of
# legs whose JOINT probability beats what the payout structure assumes --
# which on a fixed-multiplier pick'em site is pure independence, since a
# 5-pick pays 20x whatever five legs you chose.
#
#   betedge parlay verify-payouts    READ THIS FIRST. The multipliers vary
#                                    by state and change without notice.
#   betedge parlay coverage          which sports have usable prop coverage
#   betedge parlay correlations      fit correlations from your game logs
#   betedge parlay scan              build and rank tickets
#
# Every number this produces is only as good as two inputs the tool cannot
# verify for you: the payout table, and the correlation estimates. Both are
# reported on every ticket so you can see which is doing the work.
# ---------------------------------------------------------------------------
parlay:
  # Payout structures to build for. Names come from betedge/data/payouts.yaml.
  # One per book you would actually enter at. Legs are matched to a product
  # by book, so listing both keeps the two sets of tickets separate and
  # priced on their own ladders -- a PrizePicks 3-pick pays 5x and an
  # Underdog 3-pick pays 6x, which is a 3.5-point difference in the hit
  # rate each needs, and blending them would hide that.
  #
  # Underdog and PrizePicks only. DraftKings same-game parlays are
  # supported by the code (`draftkings_parlay`, priced from the book with
  # --offered-price) but are deliberately not listed: DK runs its own
  # correlation model and already discounts correlated legs, so an edge
  # there means their estimate is wrong rather than that correlation
  # exists. Far fewer hits, lower confidence, and not what this is for.
  #
  # Add the flex ladders too if you enter those; they are a genuinely
  # different bet, not a variant:
  #   - prizepicks_flex
  #   - underdog_flex
  products:
    - prizepicks_power
    - underdog_standard

  # Books whose legs are fixed-multiplier pick'em selections. The Odds API
  # carries Underdog; nothing here is scraped.
  # Books whose legs are fixed-multiplier pick'em selections. Both are
  # listed so whichever one The Odds API actually serves you produces
  # tickets; a book it does not carry simply contributes no legs, and the
  # scan says so by name rather than leaving you to wonder why a board
  # came back empty.
  pickem_books:
    - prizepicks
    - underdog

  # Monte Carlo. The seed is fixed so a re-run does not reshuffle the
  # ranking. 200k draws puts the standard error on a 20x ticket's EV at
  # under a point -- small enough to rank on, and reported either way.
  draws: 200000
  search_draws: 8000
  seed: 20260915

  # Search shape. Beam search, not enumeration: there are 658,008 five-leg
  # subsets of 40 candidates and each needs its own simulation.
  min_legs: 2
  max_legs: 5
  beam_width: 24
  max_candidates_per_group: 32
  top_n: 12

  # Correlation lives inside a game. A quarterback in one game and a centre
  # in another have no structural relationship and only add variance.
  grouping: same_game

  # Bars and guards. Stricter than the single-bet path throughout: a ticket
  # compounds the estimation error in every leg.
  min_ev: 0.02
  max_plausible_ev: 0.25       # above this something is wrong, not profitable
  max_se_ratio: 0.25           # flag when the Monte Carlo noise rivals the edge
  min_leg_edge: -0.03          # how far below break-even one leg may sit
  min_leg_prob: 0.25
  max_leg_prob: 0.90
  min_leg_ev: -0.06            # for books that post a price
  negative_pair_threshold: -0.10

  # Staking. An eighth of Kelly, against a quarter for single bets: the
  # payoff is lumpy, the probability error compounds across legs, and
  # correlated tickets lose their legs together.
  kelly_multiplier: 0.125
  max_ticket_fraction: 0.01
  # Five tickets on one game are one bet, not five.
  max_game_exposure_fraction: 0.05

  # Joint observations a fitted correlation needs before it displaces the
  # structural prior. Below this the prior is used and the pair is reported
  # as prior-based -- a hypothesis, not a measurement.
  min_correlation_sample: 100

  # Comparing a pick'em line against Pinnacle at a different number is not
  # a measurement. Leave this off; when on, every leg it touches is marked
  # estimated and the ticket is treated as suspect.
  allow_line_interpolation: false
  max_interpolation_distance: 1.0

  # Push probability assumed on an integer line when Pinnacle does not
  # price both surrounding half-lines. Flagged wherever it is used.
  assumed_push_prob: 0.05

  # -------------------------------------------------------------------------
  # ROSTERS: who plays for whom.
  #
  # The Odds API does not say. Without a team, two players in one game
  # cannot be told apart as team mates or opponents, so the sharpest
  # priors -- a QB with his own receiver at +0.45, two backs splitting
  # carries at -0.30 -- cannot be applied and weaker blended numbers are
  # used instead. See rosters.py; check what you have with
  # `betedge parlay rosters`.
  #
  # Teams arrive from four places and you need do nothing for the first
  # three:
  #   1. the game logs you fit correlations from already carry a `team`
  #      column, so `parlay correlations --from logs.csv` learns them;
  #   2. a published roster feed, fetched below (NFL only for now);
  #   3. inference from the slate itself, where a market has exactly one
  #      player per team -- two starting quarterbacks in one game are
  #      necessarily opponents, no data required;
  #   4. your own file, which overrides all of them.
  # -------------------------------------------------------------------------

  # Pull the roster feed during a scan once its snapshot has gone cold.
  # Set false to keep a scan's only network call the Odds API and refresh
  # by hand with `betedge parlay rosters --refresh`. A failed fetch never
  # stops a scan -- it costs the sharp priors, not the run.
  roster_auto_refresh: true
  roster_refresh_days: 3

  # Past this, a player's team is not used AT ALL rather than used quietly.
  # A stale roster is worse than no roster: an unknown team costs you the
  # weak blended prior, a wrong one puts a confident +0.45 on a pair that
  # is really -0.10 and nothing downstream will question it.
  roster_max_age_days: 30

  # Your own player,team[,sport,position,as_of] CSV, or a YAML mapping.
  # Highest precedence of all, because on the morning of a trade you know
  # before any feed does. Optional -- the layers above cover most of it.
  # rosters_path: data/rosters.csv

database: data/betedge.db
reports_dir: reports
