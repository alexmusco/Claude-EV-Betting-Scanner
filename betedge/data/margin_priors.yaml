# ===========================================================================
# MARGIN PRIORS
#
# What is known about a sport's margins before looking at any one game.
# Used to price every rung of a Kalshi ladder from Pinnacle's main line.
#
# READ THIS BEFORE TRUSTING A LADDER PRICE.
#
# NFL is MEASURED, from 6,983 regular-season games 1999-2026 via
# nflverse. The other three sports are still recollection and ship
# `verified: false`, with the flag riding along on every model built
# from them.
#
# Measuring the NFL changed two things and one of them inverted a design
# decision -- see calibrate.py. In short: sigma is NOT fitted per game
# from the moneyline any more. That was biased low by about 12%, in the
# direction that quietly understates the outer rungs this scan exists to
# find.
#
#     betedge kalshi calibrate --refresh      re-measure from nflverse
#
# ---------------------------------------------------------------------------
# WHAT EACH FIELD IS FOR
#
# sigma_measured  The standard deviation of (final margin minus closing
#                 spread), measured over finished games. When present,
#                 THIS is what prices the ladder, and the moneyline
#                 becomes a consistency check rather than the source.
#
# sigma_typical   The fallback when nothing has been measured. Sigma is
#                 then solved from the spread and the de-vigged moneyline
#                 -- which works, and is biased, so prefer measuring.
#
# sigma_low       A plausibility band, not an estimate. Its job is to
# sigma_high      catch inputs that disagree with each other -- a stale
#                 moneyline, a mismatched event, a spread read off the
#                 wrong side -- by flagging a fitted sigma that lands
#                 outside what the sport produces. Keep them WIDE. A band
#                 that is too narrow turns ordinary games into warnings
#                 and teaches you to ignore the flag.
#
# key_numbers     Extra probability mass sitting EXACTLY on a margin, as
#                 a fraction. A normal distribution spreads that mass
#                 smoothly, so a rung sitting on a key number is
#                 underpriced by a plain fit and its neighbours are
#                 overpriced -- which is exactly the error that makes an
#                 outer rung look mispriced when it is not.
#
#                 Only whole numbers matter: a rung at 3.5 cannot land on
#                 three, so the lump is already on the right side of it.
#
# HOW TO VERIFY
#
# Take a few seasons of final scores, histogram the margins, and read the
# frequencies off. That turns each number below from a recollection into
# a measurement -- at which point set `verified: true` and record what
# you fitted it from in `note`.
# ===========================================================================

meta:
  version: 1
  last_verified_by_user: null

sports:

  # -----------------------------------------------------------------------
  # NFL. The lumpiest of the four by a distance, because scores move in
  # threes and sevens. Margins of 3 and 7 are far more common than their
  # neighbours, which is why a plain normal misprices rungs sitting on
  # them and why the half-point either side of a key number is worth so
  # much more than any other half-point on the board.
  # -----------------------------------------------------------------------
  americanfootball_nfl:
    # MEASURED from 6,983 regular-season games, 1999-2026.
    # Source: nflverse/nfldata data/games.csv. Regenerate with
    #   betedge kalshi calibrate --refresh
    sigma_measured: 13.189
    sigma_typical: 13.189
    sigma_low: 8.6
    sigma_high: 17.8
    verified: true
    measured_on: "2026-09-16"
    # The moneylines imply 11.63, which is NOT the same -- see calibrate.py.
    key_numbers:
      3: 1.815
      5: -0.305
      7: 0.873
      9: -0.641
      10: 0.295
      11: -0.442
      12: -0.581
      13: -0.252
      14: 0.389
      15: -0.53
      16: -0.295
      17: 0.256
      19: -0.507
      21: 0.378
      22: -0.417
      23: -0.298
      24: 0.535
      26: -0.278
      27: 0.29
      28: 0.94
      29: -0.274
      30: -0.316
      31: 0.972

  basketball_nba:
    sigma_typical: 11.5
    sigma_low: 8.0
    sigma_high: 16.0
    total_sigma: 13.0
    verified: false
    key_numbers: {}
    note: >-
      No key numbers: basketball scoring is frequent enough that margins
      do not pile up anywhere in particular.

  # -----------------------------------------------------------------------
  # MLB. Low-scoring and discrete, so a normal is a poor fit at the
  # centre -- a one-run game is far more common than a smooth curve
  # implies, and there is no such thing as a margin of zero. The band is
  # wide because the shape is wrong, not because the variance is unknown.
  # -----------------------------------------------------------------------
  baseball_mlb:
    sigma_typical: 4.4
    sigma_low: 2.5
    sigma_high: 7.0
    total_sigma: 4.2
    verified: false
    key_numbers:
      1: 0.11
      2: 0.05
    note: >-
      A normal is a poor shape here. Prefer the main line, and treat any
      ladder rung inside two runs with suspicion -- the model is being
      asked to do something it is not built for.

  # -----------------------------------------------------------------------
  # NHL. The most discrete of all: a huge share of games are decided by
  # one goal, and the empty-net goal puts an artificial lump on two. A
  # normal is close to meaningless at these thresholds.
  # -----------------------------------------------------------------------
  icehockey_nhl:
    sigma_typical: 2.2
    sigma_low: 1.4
    sigma_high: 3.5
    total_sigma: 2.4
    verified: false
    key_numbers:
      1: 0.22
      2: 0.10
    note: >-
      One-goal games dominate and empty-net goals inflate two. Ladder
      rungs here are barely a distribution question at all; the counts
      matter more than the curve.
