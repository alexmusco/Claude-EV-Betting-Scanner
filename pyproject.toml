[project]
name = "betedge"
version = "0.1.0"
description = "Find and track positive expected value bets by de-vigging a sharp book against softer books."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.scripts]
betedge = "betedge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.package-data]
betedge = ["templates/*.xlsx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
